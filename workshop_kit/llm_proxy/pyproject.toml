[project]
name = "workshop-llm-proxy"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "pyjwt>=2.9",
    "uvicorn>=0.32",
    "workshop-config",
    "workshop-text-vectors",
]

[tool.uv]
package = false

[tool.uv.sources]
workshop-config = { path = "../../shared/workshop_config", editable = true }
workshop-text-vectors = { path = "../../shared/text_vectors", editable = true }
