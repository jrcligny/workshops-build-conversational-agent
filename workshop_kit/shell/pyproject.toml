[project]
name = "workshop-conversation-api"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "mcp>=2.3.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "uvicorn>=0.32",
    "workshop-config",
]

[tool.uv]
package = false

[tool.uv.sources]
workshop-config = { path = "../../shared/workshop_config", editable = true }
