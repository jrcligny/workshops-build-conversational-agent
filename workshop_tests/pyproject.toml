[project]
name = "workshop-tests"
version = "0.1.0"
description = "Shared fixtures, evaluation helpers and dependencies for workshop and kit tests"
requires-python = ">=3.13"
dependencies = [
    "workshop-tools",
    "httpx>=0.27",
    "fastapi>=0.115",
    "mcp>=2.3.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyjwt>=2.9",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "sqlite-vec>=0.1.9",
    "sse-starlette>=2.1",
    "uvicorn>=0.32",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "workshop-config",
    "workshop-text-vectors",
    "workshop-business-api",
    "workshop-docs-search",
    "workshop-agent-sdk",
    "workshop-agent-gateway",
    "workshop-model-gateway",
]

[tool.uv]
package = false

[tool.uv.sources]
workshop-tools = { path = "../workshop_kit/bootstrap", editable = true }
workshop-config = { path = "../shared/workshop_config", editable = true }
workshop-text-vectors = { path = "../shared/text_vectors", editable = true }
workshop-business-api = { path = "../business/business_api", editable = true }
workshop-docs-search = { path = "../business/docs_search", editable = true }
workshop-agent-sdk = { path = "../agent_sdk", editable = true }
workshop-agent-gateway = { path = "../gateway/agent_gateway", editable = true }
workshop-model-gateway = { path = "../gateway/model_gateway", editable = true }

[tool.pytest.ini_options]
# Kit tests sit next to the component they test (`<component>/tests/`); chat-ui has its own project.
testpaths = ["../agent_sdk", "../business", "../gateway", "../workshop_kit", "../workshop_tests", "../workshops"]
norecursedirs = [".*", "__pycache__", "node_modules", "venv", "chat-ui", "inert_agent"]
pythonpath = [".."]
# Fixture loading and source paths remain explicit when running from another cwd.
addopts = "-q --strict-markers --import-mode=importlib -p workshop_tests.testing.fixtures -p workshop_tests.testing.superseded -p workshop_tests.testing.private"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "business_api: tests of the business API test app (must pass)",
    "docs_search: tests of the document search test app (must pass)",
    "llm_proxy: tests of the LLM proxy (must pass)",
    "shell: tests of the framework and of the empty shell (must pass)",
    "workshop: success-criterion tests of a workshop (must fail on the empty shell)",
]