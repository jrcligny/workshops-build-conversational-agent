[project]
name = "workshop-model-gateway"
version = "0.1.0"
description = "Model gateway: OpenAI-compatible proxy in front of Azure OpenAI, with simulated and replay modes"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "pyjwt>=2.9",
    "uvicorn>=0.32",
    "workshop-config",
    "workshop-text-vectors",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/model_gateway"]

[tool.uv.sources]
workshop-config = { path = "../../shared/workshop_config", editable = true }
workshop-text-vectors = { path = "../../shared/text_vectors", editable = true }
