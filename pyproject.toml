[project]
name = "workshops-build-conversational-agent"
version = "0.1.0"
description = "Environnement et tests des ateliers — De l'assistant à l'agent"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "mcp>=2.3.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyjwt>=2.9",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "sqlite-vec>=0.1.9",
    "sse-starlette>=2.1",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[project.scripts]
atelier = "outils.atelier:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["application", "documentation", "proxy", "socle", "outils", "services"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::DeprecationWarning",
]
markers = [
    "application: tests de l'application métier (doivent passer)",
    "documentation: tests de la base documentaire (doivent passer)",
    "proxy: tests du proxy (doivent passer)",
    "socle: tests du cadre et de la coquille (doivent passer)",
    "atelier: tests de critère de réussite d'un atelier (doivent échouer sur la coquille vide)",
]

[tool.ruff]
line-length = 100
target-version = "py315"
