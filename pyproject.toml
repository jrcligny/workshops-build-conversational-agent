[project]
name = "workshops-build-conversational-agent"
version = "0.1.0"
description = "Environment and end-to-end tests for the workshops of the book on conversational agents"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "mcp>=2.3.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyjwt>=2.9",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "sqlite-vec>=0.1.9",
    "sse-starlette>=2.1",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[project.scripts]
workshop = "workshop_kit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["workshop_kit"]

[tool.pytest.ini_options]
testpaths = ["tests/kit", "workshops"]
pythonpath = ["."]
# Workshop folders have hyphenated names and no __init__.py: importlib mode
# collects the colocated tests without package names.
addopts = "-q --strict-markers --import-mode=importlib"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::DeprecationWarning",
]
markers = [
    "business_api: tests of the business API test app (must pass)",
    "docs_search: tests of the document search test app (must pass)",
    "llm_proxy: tests of the LLM proxy (must pass)",
    "shell: tests of the framework and of the empty shell (must pass)",
    "workshop: success-criterion tests of a workshop (must fail on the empty shell)",
]

[tool.ruff]
line-length = 100
target-version = "py313"
