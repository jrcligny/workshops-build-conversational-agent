[project]
name = "workshop-tools"
version = "0.1.0"
description = "CLI and local service orchestration for the conversational agent workshops"
requires-python = ">=3.13"
dependencies = ["httpx>=0.27"]

# Test environment of the kit and workshop tests (`workshop check*` adds `--group tests`).
# Not a default group: `python start.py` (`uv sync`) never installs it.
[dependency-groups]
tests = [
    "workshop-agent-testkit",
    "fastapi>=0.115",
    "mcp>=2.3.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyjwt>=2.9",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "sqlite-vec>=0.1.9",
    "sse-starlette>=2.1",
    "uvicorn>=0.32",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "workshop-config",
    "workshop-text-vectors",
    "workshop-business-api",
    "workshop-docs-search",
    "workshop-agent-sdk",
    "workshop-agent-gateway",
    "workshop-model-gateway",
]

[tool.uv.sources]
workshop-agent-testkit = { path = "../../agent_testkit", editable = true }
workshop-config = { path = "../../shared/workshop_config", editable = true }
workshop-text-vectors = { path = "../../shared/text_vectors", editable = true }
workshop-business-api = { path = "../../business/business_api", editable = true }
workshop-docs-search = { path = "../../business/docs_search", editable = true }
workshop-agent-sdk = { path = "../../agent_sdk", editable = true }
workshop-agent-gateway = { path = "../../gateway/agent_gateway", editable = true }
workshop-model-gateway = { path = "../../gateway/model_gateway", editable = true }

[project.scripts]
workshop = "workshop_tools.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/workshop_tools"]
[tool.pytest.ini_options]
# Kit tests sit next to the component they test (`<component>/tests/`, `tooling/cli/integration/`);
# clients/chat_ui has its own project.
testpaths = ["../../agent_sdk", "../../agent_testkit", "../../business", "../../gateway", "../../tooling", "../../workshops"]
norecursedirs = [".*", "__pycache__", "node_modules", "venv", "inert_agent"]
# Fixture loading and source paths remain explicit when running from another cwd.
addopts = "-q --strict-markers --import-mode=importlib -p agent_testkit.fixtures -p agent_testkit.superseded -p agent_testkit.private -p agent_testkit.steps"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "business_api: tests of the business API test app (must pass)",
    "docs_search: tests of the document search test app (must pass)",
    "llm_proxy: tests of the LLM proxy (must pass)",
    "shell: tests of the framework and of the empty shell (must pass)",
    "workshop: success-criterion tests of a workshop (must fail on the empty shell)",
]
