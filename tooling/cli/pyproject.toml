[project]
name = "workshop-tools"
version = "0.1.0"
description = "CLI and local service orchestration for the conversational agent workshops"
requires-python = ">=3.13"
dependencies = ["httpx>=0.27"]

[project.scripts]
workshop = "workshop_tools.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/workshop_tools"]