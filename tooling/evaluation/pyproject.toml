[project]
name = "workshop-evaluation"
version = "0.1.0"
description = "Semantic judge of the workshop tests: structural layer, meaning layer"
requires-python = ">=3.13"
dependencies = ["httpx>=0.27", "workshop-config"]

[tool.uv.sources]
workshop-config = { path = "../../shared/workshop_config", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evaluation"]
