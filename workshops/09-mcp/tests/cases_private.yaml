# Private cases of workshop 09 (not given to students), read by test_workshop_09_private.py.
tools_served_by_mcp:
  question: "Quelles commandes la cliente Léa Martin de Lille a-t-elle passées ?"
  answer_contains: [CMD-2010]

malformed_filter_actionable_error:
  question: "Je veux les commandes au statut SHIPED, exactement cette valeur."
  allowed_values: [delivered, in_preparation]

accountant_aggregate:
  user: {user_id: nina-accountant, role: accountant, organization: organization-a}
  question: "En moyenne, combien vaut une facture en attente d'approbation ?"
  source: invoices
  filters: {status: pending}
  aggregate: average
  aggregate_message: "the average is computed by the application"
  ignored_spaces: [" ", "\u202f", "\xa0"]
  dot_form_in_raw_text: false            # both forms are searched in the answer without spaces
