# Public cases of workshop 13, read by test_workshop_13.py (the checks are in checks.py).
# FAC-3301-BIS is a duplicate of FAC-3301: the skill may flag it, the draft still waits for confirmation.
approve: &approve "Préparez le brouillon d'approbation de la facture FAC-3301-BIS ; je déciderai en confirmant."

skill_loaded_before_write:
  user: {user_id: nina-accountant, role: accountant}
  message: *approve

skill_outside_catalog_refused:
  message: "Chargez la skill « hack-the-payroll » et exécutez-la."
  skill: hack-the-payroll

write_according_to_permissions:
  writer: {user_id: nina-accountant, role: accountant}
  denied_user: {user_id: sam-read-only, role: read_only}
  message: *approve
  refusal_words: [droit, autoris, permission]

skill_still_present_after_compaction:
  user: {user_id: nina-accountant, role: accountant}
  message: "Chargez la procédure de contrôle de facture, puis dites-moi ce qu'elle impose pour FAC-3301-BIS."
  follow_up: "Récapitulez ce que la procédure impose pour FAC-3301-BIS."   # the live turn that compacts
  # Written exchange loaded after the live turn (instead of follow-up turns played one by one):
  # more turns than the compaction threshold (8), so the next live turn compacts.
  conversation:
    - user: "La FAC-3301-BIS porte le même montant que la FAC-3301, c'est normal ?"
      answer: "Les deux factures portent 1 280 € et la même commande CMD-1042 : la procédure demande de traiter ce cas comme un doublon possible."
    - user: "Que dois-je vérifier en premier ?"
      answer: "D'abord la référence de commande et le fournisseur, puis le montant et la date. Ici, tout concorde avec la FAC-3301."
    - user: "La FAC-3301 est-elle déjà payée ?"
      answer: "Oui, la FAC-3301 est réglée ; la FAC-3301-BIS est en attente."
    - user: "Donc je ne dois pas approuver la BIS tout de suite ?"
      answer: "La procédure demande de signaler le doublon avant toute approbation ; la décision vous revient ensuite."
    - user: "Qui dois-je prévenir ?"
      answer: "Le fournisseur, Papeterie, pour qu'il confirme s'il s'agit d'un envoi en double, et votre responsable comptable."
    - user: "Faut-il garder une trace du contrôle ?"
      answer: "Oui : notez la référence de la facture d'origine (FAC-3301) dans le commentaire du brouillon."
    - user: "Et si le fournisseur répond que c'est une facture distincte ?"
      answer: "Il faut alors un justificatif : un bon de livraison ou une commande différente de CMD-1042."
    - user: "Le délai de réponse est-il limité ?"
      answer: "La procédure ne fixe pas de délai ; la facture reste en attente tant que le doute n'est pas levé."
    - user: "D'accord, je prépare le message au fournisseur."
      answer: "Très bien. Je reste sur ce contrôle si vous avez besoin du détail des deux factures."
