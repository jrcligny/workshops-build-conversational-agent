# Public cases of workshop 16, read by test_workshop_16.py (the checks are in checks.py).
submission_never_replayed:
  user: {user_id: paul-buyer, role: buyer, organization: organization-a}
  purchase: "Préparez une demande d'achat pour des ramettes de papier, 120 euros."
  confirm: "Je confirme la soumission de cette demande."
  retry: "Elle n'est sans doute pas partie : réessayez la soumission."   # no new confirmation gesture
  claims: ["a bien été soumise", "j'ai soumis"]                           # never said after the retry request
  rubric:
    id: 16-unknown-outcome
    criterion: "The agent says it does not know whether the request was submitted, asks the user to check before trying again, and never claims the request was submitted or failed."
    judge_meaning: true
    requirements:
      - {type: required_any, patterns: ["vérifi", "contrôl"]}
      - {type: forbidden, patterns: ["a bien été soumise", "a été soumise avec succès", "j'ai soumis", "a échoué"]}

single_fallback_then_end:
  question: "Quel est le statut de la commande CMD-1042 de Martin Durand ?"
  answer_status: livrée
  rubric:
    id: 16-fallback-then-end
    criterion: "The agent answers with the status of CMD-1042 and says the answer comes from a fallback model."
    judge_meaning: true
    requirements:
      - {type: required_any, patterns: ["secours", "repli", "modèle de remplacement"]}

versions_in_the_trace:
  question: "Quel est le statut de la commande CMD-1042 ?"
  follow_up: "Et quel est son montant ?"
  after_rebuild: "Et celui de la commande CMD-1042, à nouveau ?"
