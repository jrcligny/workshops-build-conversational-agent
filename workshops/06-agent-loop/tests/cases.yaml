# Public cases of workshop 06, read by test_workshop_06.py (the checks are in checks.py).
several_cycles:
  question: &chained "Trouvez Léa Martin de Lille et donnez-moi le statut de sa commande."
  label: 06-several-cycles          # label of the repeated check

independent_calls_grouped:
  question: "Donnez-moi le statut de CMD-1042 et, en même temps, la liste des clients nommés Léa Martin."
  label: 06-independent-calls-grouped

steps_reported_to_the_interface:
  question: *chained

cycle_limit_partial_answer:
  question: >-
    Faites une revue complète de toutes les commandes de Transports Morel, une par une,
    en vérifiant le détail de chacune, sans vous arrêter.
  rubric:
    id: 06-cycle-limit-partial
    criterion: >-
      At the cycle limit, the agent says in French that its answer is partial and names what
      it could not verify; it does not present the review as complete.
    judge_meaning: true
    requirements:
      - type: required_any
        patterns: [partiel, partielle, incomplet, incomplète]
      - type: forbidden
        patterns: [revue complète effectuée, toutes les commandes ont été vérifiées]

# The same request, interrupted then not interrupted.
interruption_stops_without_new_call:
  question: &interrupted "Trouvez Léa Martin de Lille, puis toutes ses commandes, puis leur détail."

without_interruption_the_same_request_runs:
  question: *interrupted
