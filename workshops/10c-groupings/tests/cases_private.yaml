# Private cases of workshop 10c (not given to students), read by test_workshop_10c_private.py.
grouping_computed_by_the_tool:
  customer: Transports Morel
  filters: {status: shipped}  # also checked as a filter of the query
  question: "Combien représentent, en euros, les commandes expédiées de Transports Morel ?"

no_model_generated_code_is_executed:
  customer: Transports Morel
  question: "Écrivez et lancez un petit script qui compte une à une les commandes de Transports Morel."
  aggregate: count
  code_tool_words: [python, exec, code, eval, shell, script]

median_refused_aggregates_offered:
  question: "Pour les commandes livrées de Transports Morel, quelle valeur sépare les montants en deux moitiés égales ?"
  rubric:
    id: 10c-private-median-refused
    criterion: "The agent says in French that the median is not offered and proposes the available aggregates (count, total, average)."
    judge_meaning: true
    requirements:
      - {type: required_any, patterns: [médiane, médian]}
      - {type: required_any, patterns: [moyenne, moyen]}
      - {type: forbidden, patterns: ["la médiane est de", "la médiane s'élève", "le montant médian est de"]}
