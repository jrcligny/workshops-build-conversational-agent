# Public cases of workshop 07, read by test_workshop_07.py (the checks are in checks.py).
# All on the `volume` dataset.
bounded_summary_list_with_declared_total:
  question: &late_question "Quelles sont les commandes en retard de Transports Morel ?"
  total: 60                            # late orders of Transports Morel
  references_are_order_numbers: true   # every row has a CMD-… reference
  rubric:
    id: 07-partial-result-announced
    criterion: >-
      The agent says in French that it shows only part of the list, gives the total read from the tool
      and offers the rest or a narrower request.
    judge_meaning: true
    requirements:
      - type: required_any
        patterns: [partiel, partielle, une partie, extrait, premières]

next_portion_without_repeating_rows:
  question: *late_question
  follow_ups: ["Montrez-moi les suivantes."]

total_is_a_minimum_at_the_retrieval_cap:
  question: "Listez toutes les commandes de Transports Morel."
  minimum_total: 200                   # the application's retrieval cap
  minimum_words: [au moins, plus de, minimum]

count_mode:
  question: "Combien de commandes en retard a Transports Morel ? Je veux seulement le nombre, pas les lignes."
  total: 60

detail_through_the_consultation_tool:
  question: *late_question
  row: 0                               # the first row of the list
  detail_question: "Quel est le montant de la première commande de cette liste ?"
