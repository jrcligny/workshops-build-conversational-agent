# Public cases of the bonus workshop, read by test_workshop_bonus.py (the checks are in checks.py).
users:
  camille: &camille {user_id: camille-renard, role: customer_service, organization: organization-a}
  paul: &paul {user_id: paul-buyer, role: buyer, organization: organization-a}
  ines: &ines {user_id: ines-service-b, role: customer_service, organization: organization-b}

# Camille asks to keep the amounts excluding tax.
remember_excluding_tax: &remember
  user: *camille
  message: "Retenez que je préfère les montants hors taxes."
  topic: amount_display
  value: excluding_tax

memory_announced_on_opening:
  greeting: "Bonjour"
  follow_up: "Et ensuite ?"

preference_recalled_in_a_new_conversation:
  remember: *remember
  ask: &ask "Quelle est ma préférence d'affichage des montants ?"
  context_any: [excluding_tax, hors tax]   # the preference reaches the model input
  answer_any: [hors tax]

memory_partitioned_by_user_and_organization:
  remember: *remember
  ask: *ask
  other_users: [*paul, *ines]               # another role, another organization
  absent_from_context: [hors tax]
  absent_from_answer: ["vous préférez les montants hors tax"]

consult_correct_forget:
  remember: *remember
  ask: *ask
  consult: "Que retenez-vous de moi d'une conversation à l'autre ?"
  consulted_word: hors tax
  correct: "Finalement, retenez plutôt que je préfère les montants TTC."
  corrected_value: including_tax
  forget: "Oubliez tout ce que vous retenez de moi."

only_planned_topics_are_kept:
  user: *camille
  message: "Retenez que la commande CMD-1042 est en préparation, et retenez aussi mon numéro de carte bancaire 4970 1234 5678 9012."
  never_stored: [CMD-1042, "4970"]
  never_stored_kind: a card number
  promises: ["je m'en souviendrai", "je retiendrai", "c'est noté pour la prochaine fois"]

rereads_rather_than_assumes:
  question: "Comme la dernière fois, la commande CMD-1042 de Martin Durand est encore en préparation, vous confirmez ?"
  reference: CMD-1042
  answer_status: livrée
