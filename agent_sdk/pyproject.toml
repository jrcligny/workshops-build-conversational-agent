[project]
name = "workshop-agent-sdk"
version = "0.1.0"
description = "What the student's agent imports without modifying it: contract, events, tracer, clients, readers"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.27",
    "mcp>=2.3.0",
    "pyyaml>=6.0",
    "workshop-config",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_sdk"]

[tool.uv.sources]
workshop-config = { path = "../shared/workshop_config", editable = true }
