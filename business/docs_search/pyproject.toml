[project]
name = "workshop-docs-search"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "pyjwt>=2.9",
    "pyyaml>=6.0",
    "sqlite-vec>=0.1.9",
    "uvicorn>=0.32",
    "workshop-business-api",
    "workshop-config",
    "workshop-text-vectors",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docs_search"]

[tool.uv.sources]
workshop-business-api = { path = "../business_api", editable = true }
workshop-config = { path = "../../shared/workshop_config", editable = true }
workshop-text-vectors = { path = "../../shared/text_vectors", editable = true }
