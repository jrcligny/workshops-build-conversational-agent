name: CI

on:
  push:
    branches: [main, feat/**]
  pull_request:
    branches: [main]

jobs:
  tests:
    name: tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.13"
      - name: Install tooling project dependencies
        run: uv sync --project workshop_kit/bootstrap --locked
      - name: Install test project dependencies
        run: uv sync --project workshop_tests --locked
      - name: Infrastructure tests (business API, document search, proxy, shell)
        run: uv run --project workshop_tests pytest -c workshop_tests/pyproject.toml workshop_kit workshop_tests
      - name: Validate startup of all six isolated application projects
        run: uv run --project workshop_kit/bootstrap workshop serve --check --port-offset 100
      - name: Workshop tests must fail on the empty shell
        run: uv run --project workshop_kit/bootstrap workshop check-shell
      - name: Workshop tests must fail against the inert agent
        run: uv run --project workshop_kit/bootstrap workshop check-inert
      - name: Install the chat UI in its own project environment
        run: uv sync --project workshop_kit/chat-ui --extra dev --locked
      - name: Chainlit adapter and presentation tests
        run: uv run --project workshop_kit/chat-ui pytest --confcutdir workshop_kit/chat-ui workshop_kit/chat-ui/tests
