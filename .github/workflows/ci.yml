name: CI

on:
  push:
    branches: [main, feat/**]
  pull_request:
    branches: [main]

jobs:
  tests:
    name: tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.13"
      - name: Install Python and the dependencies
        run: uv sync --extra dev --python 3.13
      - name: Infrastructure tests (business API, document search, proxy, shell)
        run: uv run pytest tests/kit
      - name: Workshop tests must fail on the empty shell
        run: uv run workshop check-shell
      - name: Install the chat UI in its own project environment
        run: uv sync --project workshop_kit/chat-ui --extra dev --locked
      - name: Chainlit adapter and presentation tests
        run: uv run --project workshop_kit/chat-ui pytest --confcutdir workshop_kit/chat-ui workshop_kit/chat-ui/tests
