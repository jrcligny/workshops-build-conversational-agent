name: CI

on:
  push:
    branches: [main, feat/**]
  pull_request:
    branches: [main]

jobs:
  tests:
    name: tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.13"
      - name: Install tooling project dependencies
        run: uv sync --project tooling/cli --locked
      - name: Install test project dependencies
        run: uv sync --project tooling/cli --group tests --locked
      - name: Infrastructure tests (business API, document search, proxy, shell)
        run: uv run --project tooling/cli --group tests pytest -c tooling/cli/pyproject.toml agent_sdk business gateway tooling
      - name: Validate startup of all six isolated application projects
        run: uv run --project tooling/cli workshop serve --check --port-offset 100
      - name: Workshop tests must fail on the empty shell
        run: uv run --project tooling/cli workshop check-bootstrap
      - name: Workshop tests must fail against the inert agent
        run: uv run --project tooling/cli workshop check-inert
      - name: Install the chat UI in its own project environment
        run: uv sync --project clients/chat_ui --extra dev --locked
      - name: Chainlit adapter and presentation tests
        run: uv run --project clients/chat_ui pytest --confcutdir clients/chat_ui clients/chat_ui/tests
