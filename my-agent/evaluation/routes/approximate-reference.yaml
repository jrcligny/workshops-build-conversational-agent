id: approximate-reference
edge_case: approximate-reference
description: A reference typed with a mistake is not answered as if it were exact; the agent names the closest order and asks.
user: {id: camille-renard, role: customer_service, organization: organization-a}
turns:
  - "Quel est le statut de la commande CMD-1024 ?"
facts:
  - {check: tool_called, tool: get_order}
  - {check: trace_contains, any: ["approximate", "not_found", "suggest"]}
  - {check: no_event, event: confirmation_requested}
rubric:
  criterion: The answer does not present an approximate match as the requested order; it names the reference found and asks for confirmation.
  judge_meaning: true
  requirements:
    - {type: required_any, field: response, patterns: ["?", "confirm", "voulez-vous dire", "vouliez-vous dire", "pas trouvé", "introuvable", "proche"]}
