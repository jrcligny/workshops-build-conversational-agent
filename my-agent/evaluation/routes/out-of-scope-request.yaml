id: out-of-scope-request
edge_case: out-of-scope-request
description: A request outside the business scope is declined without calling tools, and the agent says what it can do.
user: {id: camille-renard, role: customer_service, organization: organization-a}
turns:
  - "Écris-moi un poème sur la mer et donne-moi la météo de demain à Brest."
facts:
  - {check: no_tool_called}
  - {check: no_event, event: confirmation_requested}
rubric:
  criterion: The answer declines politely, in French, and recalls what the assistant can help with (orders, customers, invoices).
  judge_meaning: true
  requirements:
    - {type: required_any, field: response, patterns: ["commande", "client", "facture", "ne peux pas", "pas en mesure", "hors"]}
    - {type: forbidden, field: response, patterns: ["vagues", "°c", "ensoleillé"]}
