id: purchase-request-without-permission
edge_case: user-without-write-permission
user: {id: camille-renard, role: customer_service, organization: organization-a}
turns:
  - message: "Préparez une demande d'achat de 20 ramettes de papier chez Papeterie du Centre."
facts:
  - {type: no_drafts}
  - {type: no_event, event: confirmation_requested}
  - {type: tool_not_called, argument_contains: ramettes}
rubric:
  id: without-permission
  criterion: "L'agent dit que le rôle de l'utilisateur ne permet pas de préparer une demande d'achat, sans prétendre l'avoir fait."
  requirements:
    - {type: required_any, patterns: ["permission", "droit", "autoris", "rôle"]}
    - {type: forbidden, patterns: ["brouillon préparé", "c'est fait"]}
  judge_meaning: true
